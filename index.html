<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard</title>
  <meta name="description" content="Mini dashboard de solo lectura desde Google Sheets">
  <meta name="theme-color" content="#1f6feb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- iOS -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dashboard">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ptr" class="ptr" aria-hidden="true"><span class="ptr-icon">↓</span></div>

  <header class="app-header">
    <div class="header-text">
      <h1 id="title">Dashboard</h1>
      <p id="updated" class="updated">Cargando…</p>
    </div>
    <a id="editBtn" class="btn btn-icon" href="#" target="_blank" rel="noopener" aria-label="Editar hoja en Google Sheets" title="Editar en Google Sheets" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </a>
    <button id="refreshBtn" class="btn" type="button" aria-label="Actualizar datos">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      <span>Actualizar</span>
    </button>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar en todas las columnas…" autocomplete="off" enterkeyhint="search" aria-label="Buscar">
    <div class="sort-mobile">
      <label for="sortSelect" class="visually-hidden">Ordenar por</label>
      <select id="sortSelect" aria-label="Ordenar por"></select>
      <button id="sortDirBtn" class="btn btn-icon" type="button" aria-label="Cambiar dirección de orden">↑</button>
    </div>
  </div>

  <div id="banner" class="banner" role="status" hidden></div>
  <div id="summary" hidden></div>
  <p id="count" class="count"></p>

  <main id="content">
    <div class="loading"><div class="spinner"></div><p>Cargando datos…</p></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
